<!doctype html>
<!-- Generated from src/layout.html and src/pages/{{source}}. Run npm run build after editing the source. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0b1320">
  <meta name="color-scheme" content="dark light">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://jpretty01.github.io/images/headshot.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/jpeg" href="{{prefix}}images/jpretty01.jpg">
  <link rel="stylesheet" href="{{prefix}}site.css?v={{version}}">
  <script src="{{prefix}}site.js?v={{version}}" defer></script>
{{extraHead}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="{{prefix}}./" aria-label="Jeremy Pretty home"><span class="brand-mark" aria-hidden="true">JP</span>Jeremy Pretty<span class="brand-dot" aria-hidden="true">.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" hidden>Menu</button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">{{navigation}}</nav>
      <button class="theme-toggle" type="button" aria-label="Switch to light appearance" hidden><span class="theme-symbol" aria-hidden="true">◐</span><span class="theme-label">Light</span></button>
    </div>
  </header>
  <main id="main" tabindex="-1">{{content}}</main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-top"><div><a class="footer-name" href="{{prefix}}./">Jeremy Pretty<span aria-hidden="true">.</span></a><p>Systems, teams, and ideas.</p></div><nav class="footer-links" aria-label="Explore"><a href="{{prefix}}Github.html">GitHub &amp; code</a><a href="https://gaming.tmfpretty.com/">Gaming</a><a href="{{prefix}}Blog.html">Writing</a><a href="{{prefix}}Contact.html">Contact</a></nav></div>
      <div class="footer-bottom"><span>© 2026 Jeremy Pretty</span><span>Built with purpose. Made personal.</span></div>
    </div>
  </footer>
</body>
</html>
